# Dependabot is configured in SECURITY-ONLY mode.
#
# Dependabot SECURITY updates (enabled in repo Settings → Code security)
# automatically opens pull requests to fix *known vulnerabilities* in both
# GitHub Actions and npm dependencies. Those are the only PRs Dependabot
# will open — you'll only hear from it for real security issues.
#
# Dependabot VERSION updates (routine version bumps) are intentionally
# disabled by leaving `updates` empty, so there is no weekly PR noise.
#
# To re-enable routine version updates later, add an ecosystem block, e.g.:
#   - package-ecosystem: "github-actions"
#     directory: "/"
#     schedule:
#       interval: "weekly"

version: 2
updates: []
