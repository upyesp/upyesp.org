# - 'build': gate on every PR (branch protection on `main` requires it).
# - 'auto-merge': enables native auto-merge for Dependabot PRs.
# - 'redeploy': when a PR merges, dispatches the Pages deploy — merges made
#   via GITHUB_TOKEN-enabled auto-merge do NOT fire the push-based deploy.
name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  build:
    name: build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.121.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Setup Hugo CLI
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Install dependencies
        run: "[[ -f package-lock.json ]] && npm ci || true"
      - name: Build site
        run: hugo --gc --minify --baseURL "/"

  auto-merge:
    name: auto-merge
    needs: build
    if: github.actor == 'dependabot[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash) for Dependabot PR
        run: gh pr merge "$PR_URL" --squash --auto --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  redeploy:
    name: redeploy
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages deploy for the merged PR
        run: gh workflow run deploy.yml --repo upyesp/upyesp.org --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
