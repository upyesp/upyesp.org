# Runs the site build as a gate on every pull request, and enables
# GitHub-native auto-merge for Dependabot PRs once the build is green.
# Branch protection on `main` requires the "build" check to pass.
name: PR checks

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.121.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Setup Hugo CLI
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Install dependencies
        run: "[[ -f package-lock.json ]] && npm ci || true"
      - name: Build site
        run: hugo --gc --minify --baseURL "/"

  auto-merge:
    name: auto-merge
    needs: build
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash) for Dependabot PR
        run: gh pr merge "$PR_URL" --squash --auto --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
